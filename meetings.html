<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Rooms - TaskHub</title>
    
    <!-- حارس أمني بسيط لمنع الدخول بدون تسجيل -->
    <script>
        if (!sessionStorage.getItem("activeUser")) {
            window.location.replace("index.html");
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Corporate Trust Theme */
            --primary-color: #1e40af; 
            --primary-hover: #1e3a8a;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
            --bg-color: #f8fafc; 
            --card-bg: rgba(255, 255, 255, 0.85); 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(30, 64, 175, 0.15);
            
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
            --info: #0284c7;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6; 
            --primary-hover: #60a5fa;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: var(--text-main); 
            transition: background-color 0.3s, color 0.3s; 
            position: relative;
            min-height: 100vh;
        }

        /* الهالة والشبكة */
        .premium-glow {
            position: fixed; top: -20%; right: -15%; width: 65%; height: 140%;
            background: linear-gradient(220deg, #0f172a 10%, #1e40af 50%, #38bdf8 100%);
            filter: blur(140px); border-radius: 50%; z-index: 0; opacity: 0.8;
            animation: pulseGlow 10s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-20px, 30px); }
        }

        .grid-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(30, 64, 175, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 64, 175, 0.06) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1; pointer-events: none;
        }

        nav { 
            background-color: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 40px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        [data-theme="dark"] nav { background-color: rgba(15, 23, 42, 0.75); }

        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text-main); }
        .brand-logo span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .theme-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.2s; }
        .theme-btn:hover { transform: scale(1.1) rotate(15deg); }
        .back-btn { background-color: #64748b; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background-color: #475569; transform: translateY(-2px); }

        .container { max-width: 1050px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 2; }
        
        .section-header { margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .section-header h2 { color: var(--primary-color); margin: 0; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 24px; }
        
        /* نموذج الحجز */
        .form-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            border: 1px solid var(--border-color); 
            margin-bottom: 50px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); }
        input, select { width: 100%; padding: 12px 15px; border: 2px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; background: var(--input-bg); color: var(--text-main); transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }
        
        /* زر الاقتراح الذكي */
        .btn-suggest {
            background: rgba(139, 92, 246, 0.1); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.3s; width: 100%; margin-top: 10px;
        }
        .btn-suggest:hover { background: #8b5cf6; color: white; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2); }
        [data-theme="dark"] .btn-suggest { background: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.3); }
        [data-theme="dark"] .btn-suggest:hover { background: #a855f7; color: white; }

        .btn-submit { width: 100%; background: var(--primary-gradient); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 16px; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(30, 64, 175, 0.3); display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 64, 175, 0.4); }

        /* شبكة الاجتماعات المربعة */
        .meetings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        
        .meeting-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 25px; border-radius: 16px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
            display: flex; flex-direction: column; gap: 15px; transition: 0.3s; position: relative; overflow: hidden;
        }
        .meeting-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(30, 64, 175, 0.1); }
        
        .room-Boardroom { border-left: 6px solid #8b5cf6; } 
        .room-Conference { border-left: 6px solid #0ea5e9; } 
        .room-Huddle { border-left: 6px solid #10b981; } 

        .meeting-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .meeting-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--text-main); line-height: 1.4; }
        
        .room-badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; color: white; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .badge-Boardroom { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); }
        .badge-Conference { background: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%); }
        .badge-Huddle { background: linear-gradient(135deg, #34d399 0%, #047857 100%); }

        .meeting-time { background: rgba(0,0,0,0.03); padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-color); }
        [data-theme="dark"] .meeting-time { background: rgba(255,255,255,0.03); }
        
        .meeting-booker { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-weight: 500;}

        .btn-cancel-mtg { 
            width: 100%; margin-top: auto; display: flex; justify-content: center; align-items: center; gap: 6px;
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); 
            padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 700; transition: 0.2s; 
        }
        .btn-cancel-mtg:hover { background: var(--danger); color: white; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2); }

        .empty-msg { grid-column: 1 / -1; color: var(--text-muted); font-style: italic; text-align: center; padding: 40px; background: rgba(0,0,0,0.02); border-radius: 16px; border: 1px dashed var(--border-color); font-size: 15px; backdrop-filter: blur(10px); }

        #customToast { position: fixed; top: 30px; right: 30px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: flex; align-items: center; gap: 10px; }
        #customToast.show { transform: translateX(0); }
        .toast-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast-error { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .toast-info { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); } 
    </style>
</head>
<body>

    <div class="premium-glow"></div>
    <div class="grid-overlay"></div>

    <nav>
        <!-- التعديل هنا: الشعار صار ذكي ويوجه حسب الصلاحية -->
        <div class="brand-logo" style="cursor: pointer;" onclick="
            let activeUser = JSON.parse(sessionStorage.getItem('activeUser'));
            if (activeUser.role === 'manager' || activeUser.empId === '2300' || activeUser.empId === 'admin') {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'emp_dashboard.html';
            }
        ">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" fill="var(--primary-color)" fill-opacity="0.15"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span>TaskHub System</span>
        </div>
        
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
            <button id="backBtn" class="back-btn">Back</button>
        </div>
    </nav>

    <div class="container">
        <!-- Smart Booking Form -->
        <div class="form-panel">
            <h2 style="margin-top: 0;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Book a Meeting Room
            </h2>
            
            <div class="form-grid">
                <div>
                    <div class="form-group">
                        <label>Select Room</label>
                        <select id="mtgRoom">
                            <option value="Boardroom">👑 Boardroom (15 Seats)</option>
                            <option value="Conference">💼 Conference Room (8 Seats)</option>
                            <option value="Huddle">🤝 Huddle Room (4 Seats)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Meeting Title / Purpose</label>
                        <input type="text" id="mtgTitle" placeholder="e.g., Weekly Sync, Client Pitch...">
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="mtgDate">
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label>Start Time</label>
                            <input type="time" id="mtgStart">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>End Time</label>
                            <input type="time" id="mtgEnd">
                        </div>
                    </div>
                    
                    <button type="button" class="btn-suggest" onclick="autoSuggestSlot()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        Auto-Suggest Nearest Slot
                    </button>
                </div>
            </div>
            
            <button class="btn-submit" onclick="bookMeeting()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Confirm Booking
            </button>
        </div>

        <!-- Upcoming Meetings -->
        <div class="section-header">
            <h2>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Upcoming Meetings
            </h2>
        </div>
        
        <div id="meetingsList" class="meetings-grid"></div>
    </div>

    <!-- Toast Notification -->
    <div id="customToast">
        <svg id="toastIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        let activeUser = JSON.parse(sessionStorage.getItem("activeUser"));

        document.getElementById("backBtn").onclick = function() {
            if (activeUser.role === "manager" || activeUser.empId === "2300" || activeUser.empId === "admin") {
                window.location.href = "dashboard.html";
            } else {
                window.location.href = "emp_dashboard.html";
            }
        };

        const themeToggleBtn = document.getElementById("themeToggle");
        if (localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeToggleBtn.innerText = "☀️"; }
        function toggleTheme() {
            if (document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeToggleBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeToggleBtn.innerText = "☀️";
            }
        }

        function showToast(message, type = "success") {
            let toast = document.getElementById("customToast"); 
            let msgSpan = document.getElementById("toastMsg");
            let iconSvg = document.getElementById("toastIcon");
            
            msgSpan.innerText = message; 
            toast.className = "toast-" + type + " show";
            
            if (type === 'success') {
                iconSvg.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
            } else if (type === 'info') {
                iconSvg.innerHTML = '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>';
            } else {
                iconSvg.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>';
            }
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        let todayStr = new Date().toISOString().split('T')[0];
        document.getElementById("mtgDate").setAttribute('min', todayStr);

        function autoSuggestSlot() {
            let room = document.getElementById("mtgRoom").value;
            let meetings = JSON.parse(localStorage.getItem("meetings")) || [];
            let roomMtg = meetings.filter(m => m.room === room);

            let dt = new Date();
            let safeCounter = 0; 

            while(safeCounter < 100) {
                safeCounter++;
                let m = dt.getMinutes();
                if (m > 0 && m <= 30) {
                    dt.setMinutes(30, 0, 0);
                } else if (m > 30) {
                    dt.setHours(dt.getHours() + 1, 0, 0, 0);
                }

                if (dt.getHours() >= 17) {
                    dt.setDate(dt.getDate() + 1);
                    dt.setHours(8, 0, 0, 0);
                } else if (dt.getHours() < 8) {
                    dt.setHours(8, 0, 0, 0);
                }

                let startStr = dt.getHours().toString().padStart(2, '0') + ":" + dt.getMinutes().toString().padStart(2, '0');
                let dateStr = dt.getFullYear() + "-" + (dt.getMonth() + 1).toString().padStart(2, '0') + "-" + dt.getDate().toString().padStart(2, '0');

                let endDt = new Date(dt.getTime() + 60 * 60000);
                let endStr = endDt.getHours().toString().padStart(2, '0') + ":" + endDt.getMinutes().toString().padStart(2, '0');

                let conflict = roomMtg.find(mtg => {
                    if (mtg.date !== dateStr) return false;
                    return (startStr >= mtg.startTime && startStr < mtg.endTime) || 
                           (endStr > mtg.startTime && endStr <= mtg.endTime) ||
                           (startStr <= mtg.startTime && endStr >= mtg.endTime);
                });

                if (conflict) {
                    let [cH, cM] = conflict.endTime.split(':');
                    dt.setHours(parseInt(cH), parseInt(cM), 0, 0);
                    continue; 
                } else {
                    document.getElementById("mtgDate").value = dateStr;
                    document.getElementById("mtgStart").value = startStr;
                    document.getElementById("mtgEnd").value = endStr;
                    
                    showToast("✨ Suggested nearest available slot!", "info");
                    break;
                }
            }
        }

        function loadMeetings() {
            let meetings = JSON.parse(localStorage.getItem("meetings")) || [];
            let listContainer = document.getElementById("meetingsList");
            listContainer.innerHTML = "";

            let upcomingMeetings = meetings.filter(m => m.date >= todayStr);
            
            upcomingMeetings.sort((a, b) => {
                if(a.date === b.date) return a.startTime.localeCompare(b.startTime);
                return a.date.localeCompare(b.date);
            });

            if (upcomingMeetings.length === 0) {
                listContainer.innerHTML = "<div class='empty-msg'>No upcoming meetings scheduled.</div>";
                return;
            }

            upcomingMeetings.forEach(mtg => {
                let isManagerOrAdmin = (activeUser.role === 'manager' || activeUser.empId === 'admin' || activeUser.empId === '2300');
                let canDelete = (mtg.bookedById === activeUser.empId) || isManagerOrAdmin;
                let deleteBtnHtml = canDelete ? `
                    <button class="btn-cancel-mtg" onclick="deleteMeeting('${mtg.id}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Cancel Booking
                    </button>
                ` : '';

                let timeStr = formatAMPM(mtg.startTime) + " - " + formatAMPM(mtg.endTime);

                listContainer.innerHTML += `
                    <div class="meeting-card room-${mtg.room}">
                        <div class="meeting-header">
                            <h3 class="meeting-title">${mtg.title}</h3>
                            <span class="room-badge badge-${mtg.room}">${mtg.room}</span>
                        </div>
                        <div class="meeting-time">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            ${mtg.date} <br> ${timeStr}
                        </div>
                        <div class="meeting-booker">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            Booked by: ${mtg.bookedByName}
                        </div>
                        ${deleteBtnHtml}
                    </div>
                `;
            });
        }

        function formatAMPM(time24) {
            let [hours, minutes] = time24.split(':');
            hours = parseInt(hours);
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return hours + ':' + minutes + ' ' + ampm;
        }

        function bookMeeting() {
            let room = document.getElementById("mtgRoom").value;
            let title = document.getElementById("mtgTitle").value.trim();
            let date = document.getElementById("mtgDate").value;
            let startTime = document.getElementById("mtgStart").value;
            let endTime = document.getElementById("mtgEnd").value;

            if (!title || !date || !startTime || !endTime) {
                showToast("Please fill all fields.", "error");
                return;
            }

            if (startTime >= endTime) {
                showToast("End time must be after start time.", "error");
                return;
            }

            let meetings = JSON.parse(localStorage.getItem("meetings")) || [];

            let hasConflict = meetings.some(m => {
                if (m.room === room && m.date === date) {
                    if ((startTime >= m.startTime && startTime < m.endTime) || 
                        (endTime > m.startTime && endTime <= m.endTime) ||
                        (startTime <= m.startTime && endTime >= m.endTime)) {
                        return true;
                    }
                }
                return false;
            });

            if (hasConflict) {
                showToast("⚠️ Room is already booked during this time!", "error");
                return;
            }

            let newMeeting = {
                id: "M" + Date.now(),
                room: room,
                title: title,
                date: date,
                startTime: startTime,
                endTime: endTime,
                bookedById: activeUser.empId,
                bookedByName: activeUser.firstName + " " + activeUser.lastName
            };

            meetings.push(newMeeting);
            localStorage.setItem("meetings", JSON.stringify(meetings));

            document.getElementById("mtgTitle").value = "";
            document.getElementById("mtgDate").value = "";
            document.getElementById("mtgStart").value = "";
            document.getElementById("mtgEnd").value = "";

            showToast("Meeting room booked successfully!", "success");
            loadMeetings();
        }

        function deleteMeeting(id) {
            let meetings = JSON.parse(localStorage.getItem("meetings")) || [];
            meetings = meetings.filter(m => m.id !== id);
            localStorage.setItem("meetings", JSON.stringify(meetings));
            showToast("Booking cancelled successfully.", "success");
            loadMeetings();
        }

        loadMeetings();
        window.addEventListener('storage', function(e) {
            if (e.key === 'meetings') loadMeetings();
        });
    </script>
</body>
</html>
