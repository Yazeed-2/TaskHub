<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - TaskHub</title>
    <!-- خط Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Corporate Trust Theme */
            --primary-color: #1e40af; 
            --primary-hover: #1e3a8a;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
            --bg-color: #f8fafc; 
            --card-bg: rgba(255, 255, 255, 0.85); /* شفافية زجاجية */
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(30, 64, 175, 0.15);
            
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
            --info: #3b82f6;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6; 
            --primary-hover: #60a5fa;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: var(--text-main); 
            transition: background-color 0.3s, color 0.3s; 
            position: relative;
            min-height: 100vh;
        }

        /* الهالة والشبكة (Aura & Grid) */
        .premium-glow {
            position: fixed; top: -20%; right: -15%; width: 65%; height: 140%;
            background: linear-gradient(220deg, #0f172a 10%, #1e40af 50%, #38bdf8 100%);
            filter: blur(140px); border-radius: 50%; z-index: 0; opacity: 0.8;
            animation: pulseGlow 10s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-20px, 30px); }
        }

        .grid-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(30, 64, 175, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 64, 175, 0.06) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1; pointer-events: none;
        }

        /* النافبار الزجاجي */
        nav { 
            background-color: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 40px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        [data-theme="dark"] nav { background-color: rgba(15, 23, 42, 0.75); }

        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text-main); cursor: pointer; }
        .brand-logo span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .theme-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.2s; }
        .theme-btn:hover { transform: scale(1.1) rotate(15deg); }
        .back-btn { background-color: #64748b; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background-color: #475569; transform: translateY(-2px); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 2; }
        h2 { color: var(--primary-color); margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        
        .task-section { margin-bottom: 50px; }
        
        /* بطاقات المهام الزجاجية */
        .task-card { 
            background-color: var(--card-bg); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 25px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
            border-left: 6px solid var(--primary-color);
            transition: all 0.3s ease;
        }
        .task-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(30, 64, 175, 0.1); }
        .task-card.completed { border-left-color: var(--success); opacity: 0.95; }
        
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .task-header h3 { margin: 0; font-size: 19px; color: var(--text-main); font-weight: 700; }
        
        /* أوسمة الأولوية الفخمة */
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; color: white; letter-spacing: 0.5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .badge.High { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .badge.Medium { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
        .badge.Low { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        
        .task-desc { font-size: 15px; color: var(--text-main); line-height: 1.7; margin-bottom: 20px; background: rgba(0,0,0,0.03); padding: 18px; border-radius: 10px; border: 1px solid var(--border-color); }
        [data-theme="dark"] .task-desc { background: rgba(255,255,255,0.03); }
        .task-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; font-weight: 500; display: flex; gap: 15px; }
        
        /* زر إكمال المهمة */
        .btn-complete { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; 
            padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; 
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .btn-complete:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }

        .completed-info { background-color: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 14px; color: var(--text-main); line-height: 1.6; }
        .rating-box { display: inline-block; background: linear-gradient(135deg, #fef08a 0%, #fde047 100%); color: #854d0e; padding: 8px 15px; border-radius: 8px; font-weight: 700; margin-top: 12px; box-shadow: 0 4px 6px rgba(250, 204, 21, 0.2); }
        .empty-msg { color: var(--text-muted); font-style: italic; text-align: center; padding: 30px; background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--border-color); font-size: 15px; backdrop-filter: blur(10px); }

        /* Modal الزجاجي */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 35px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 1px solid var(--border-color); text-align: center; }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); font-size: 22px; font-weight: 700; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); }
        textarea, input[type="file"] { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-family: inherit; background: var(--input-bg); color: var(--text-main); transition: 0.3s; }
        textarea:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }
        
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; }
        .btn-submit { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 12px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
        .btn-cancel { background-color: #64748b; color: white; border: none; padding: 12px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-cancel:hover { background-color: #475569; transform: translateY(-2px); }

        #customToast { position: fixed; top: 30px; right: 30px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); z-index: 9999; transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); background: linear-gradient(135deg, #10b981 0%, #059669 100%); display: flex; align-items: center; gap: 10px; }
        #customToast.show { transform: translateX(0); }
    </style>
</head>
<body>

    <!-- الهالة الفخمة المندمجة -->
    <div class="premium-glow"></div>
    <!-- شبكة الخطوط الشفافة -->
    <div class="grid-overlay"></div>

    <nav>
        <div class="brand-logo" onclick="window.location.href='emp_dashboard.html'">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" fill="var(--primary-color)" fill-opacity="0.15"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span>TaskHub Workspace</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
            <button class="back-btn" onclick="window.location.href='emp_dashboard.html'">Return to Dashboard</button>
        </div>
    </nav>

    <div class="container">
        <div class="task-section">
            <h2>⚡ Active Tasks (To-Do)</h2>
            <div id="activeTasksList"></div>
        </div>

        <div class="task-section">
            <h2>✅ Completed Tasks</h2>
            <div id="completedTasksList"></div>
        </div>
    </div>

    <!-- Complete Task Modal -->
    <div id="completeModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Complete Task</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">The system automatically records the completion time.</p>
            
            <div class="form-group">
                <label>Feedback / Notes (Optional):</label>
                <textarea id="taskNote" rows="4" placeholder="Any comments for your manager?"></textarea>
            </div>
            
            <div class="form-group">
                <label>Attach Delivery PDF (Optional):</label>
                <input type="file" id="empPdfFile" accept=".pdf">
            </div>
            
            <div class="modal-actions">
                <button class="btn-submit" onclick="prepareCompletion()">Submit Task</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="customToast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="toastMsg">Task marked as completed!</span>
    </div>

    <script>
        let activeUser = JSON.parse(sessionStorage.getItem("activeUser"));
        if (!activeUser || activeUser.role === "manager" || activeUser.empId === "2300" || activeUser.empId === "admin") { 
            window.location.href = "index.html"; 
        }

        const themeToggleBtn = document.getElementById("themeToggle");
        if (localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeToggleBtn.innerText = "☀️"; }
        function toggleTheme() {
            if (document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeToggleBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeToggleBtn.innerText = "☀️";
            }
        }

        function showToast(msg = "Task marked as completed!") {
            document.getElementById("toastMsg").innerText = msg;
            let toast = document.getElementById("customToast"); 
            toast.className = "show";
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function loadMyTasks() {
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let activeDiv = document.getElementById("activeTasksList");
            let completedDiv = document.getElementById("completedTasksList");
            activeDiv.innerHTML = ""; completedDiv.innerHTML = "";

            let myTasks = allTasks.filter(t => t.employeeId === activeUser.empId);
            myTasks.sort((a, b) => parseInt(b.taskId) - parseInt(a.taskId));

            let hasActive = false; let hasCompleted = false;

            myTasks.forEach(task => {
                let managerFileHtml = task.pdfData ? `<br><a href="${task.pdfData}" download="${task.pdfName}" target="_blank" style="color: var(--info); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 8px;">📎 Download Manager's PDF (${task.pdfName})</a>` : '';

                let cardHTML = `
                    <div class="task-card ${task.status === 'Completed' ? 'completed' : ''}">
                        <div class="task-header">
                            <h3>Task ID: #${task.taskId.substring(task.taskId.length - 4)}</h3>
                            <span class="badge ${task.priority}">${task.priority} Priority</span>
                        </div>
                        <div class="task-meta">
                            <span>📅 Assigned on: ${task.assignedDate}</span>
                            <span>👤 Manager ID: ${task.managerId}</span>
                        </div>
                        <div class="task-desc">${task.description} ${managerFileHtml}</div>
                `;

                if (task.status !== "Completed") {
                    hasActive = true;
                    cardHTML += `<button class="btn-complete" onclick="openCompleteModal('${task.taskId}')">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    Mark as Complete
                                 </button></div>`;
                    activeDiv.innerHTML += cardHTML;
                } else {
                    hasCompleted = true;
                    let empFileHtml = task.empPdfData ? `<br><a href="${task.empPdfData}" download="${task.empPdfName}" target="_blank" style="color: var(--info); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px;">📎 Download My Report PDF (${task.empPdfName})</a>` : '';

                    cardHTML += `
                        <div class="completed-info">
                            <strong>⏱️ Actual Time Taken:</strong> ${task.duration} <br>
                            <strong>💬 Note:</strong> "${task.employeeNote || 'No note provided'}"
                            ${empFileHtml}
                        </div>
                    `;
                    if (task.ratingReceived) {
                        cardHTML += `<div class="rating-box">🏆 Manager Rating: ${task.ratingReceived} / 5 ⭐</div>`;
                    } else {
                        cardHTML += `<div style="margin-top: 12px; font-size: 13px; color: var(--warning); font-weight: 600;">⏳ Waiting for manager's evaluation...</div>`;
                    }
                    cardHTML += `</div>`;
                    completedDiv.innerHTML += cardHTML;
                }
            });

            if (!hasActive) activeDiv.innerHTML = "<div class='empty-msg'>You have no active tasks at the moment. Great job catching up! 🎉</div>";
            if (!hasCompleted) completedDiv.innerHTML = "<div class='empty-msg'>No completed tasks yet. Keep pushing! 💪</div>";
        }

        let selectedTaskId = null;
        function openCompleteModal(taskId) {
            selectedTaskId = taskId;
            document.getElementById("taskNote").value = "";
            document.getElementById("empPdfFile").value = "";
            document.getElementById("completeModal").style.display = "flex";
        }
        function closeModal() {
            selectedTaskId = null;
            document.getElementById("completeModal").style.display = "none";
        }

        function prepareCompletion() {
            let note = document.getElementById("taskNote").value.trim();
            let fileInput = document.getElementById("empPdfFile");

            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    executeCompletion(note, e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                executeCompletion(note, null, null);
            }
        }

        function executeCompletion(note, empPdfData, empPdfName) {
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let taskIndex = allTasks.findIndex(t => t.taskId === selectedTaskId);
            
            if (taskIndex !== -1) {
                let task = allTasks[taskIndex];
                let startTime = parseInt(task.taskId);
                let durationMs = Date.now() - startTime;
                
                let totalMins = Math.floor(durationMs / 60000);
                let days = Math.floor(totalMins / 1440);
                let hours = Math.floor((totalMins % 1440) / 60);
                let mins = totalMins % 60;

                let durationStr = "";
                if (days > 0) durationStr += days + " Days, ";
                if (hours > 0) durationStr += hours + " Hours, ";
                durationStr += mins + " Mins";
                if (durationStr === "0 Mins") durationStr = "Less than a minute";

                allTasks[taskIndex].status = "Completed";
                allTasks[taskIndex].duration = durationStr;
                allTasks[taskIndex].employeeNote = note;
                allTasks[taskIndex].empPdfData = empPdfData;
                allTasks[taskIndex].empPdfName = empPdfName;
                
                localStorage.setItem("allTasks", JSON.stringify(allTasks));
                showToast("Task completed successfully!");
                loadMyTasks();
            }
            closeModal();
        }

        loadMyTasks();
        window.addEventListener('storage', function(e) {
            if (e.key === 'allTasks') {
                loadMyTasks(); 
                showToast("You have a new update in your tasks!");
            }
        });
    </script>
</body>
</html>
