<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - TaskHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Corporate Trust Theme */
            --primary-color: #1e40af; 
            --primary-hover: #1e3a8a;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
            --bg-color: #f8fafc; 
            --card-bg: rgba(255, 255, 255, 0.85); 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(30, 64, 175, 0.15);
            
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
            --info: #0284c7;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6; 
            --primary-hover: #60a5fa;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: var(--text-main); 
            transition: background-color 0.3s, color 0.3s; 
            position: relative;
            min-height: 100vh;
        }

        /* الهالة والشبكة */
        .premium-glow {
            position: fixed; top: -20%; right: -15%; width: 65%; height: 140%;
            background: linear-gradient(220deg, #0f172a 10%, #1e40af 50%, #38bdf8 100%);
            filter: blur(140px); border-radius: 50%; z-index: 0; opacity: 0.8;
            animation: pulseGlow 10s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-20px, 30px); }
        }

        .grid-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(30, 64, 175, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 64, 175, 0.06) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1; pointer-events: none;
        }

        nav { 
            background-color: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 40px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        [data-theme="dark"] nav { background-color: rgba(15, 23, 42, 0.75); }

        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text-main); cursor: pointer; }
        .brand-logo span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .theme-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.2s; }
        .theme-btn:hover { transform: scale(1.1) rotate(15deg); }
        .back-btn { background-color: #64748b; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background-color: #475569; transform: translateY(-2px); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 2; }
        
        h2 { color: var(--primary-color); margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 26px; }

        .search-bar {
            width: 100%; padding: 15px 20px 15px 50px; border: 2px solid var(--border-color);
            border-radius: 12px; font-size: 15px; background: var(--card-bg); color: var(--text-main);
            backdrop-filter: blur(10px); transition: 0.3s; box-sizing: border-box; margin-bottom: 30px;
            font-family: inherit;
        }
        .search-bar:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }
        .search-wrapper { position: relative; width: 100%; max-width: 500px; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-muted); }

        .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-bottom: 50px; }

        .emp-card {
            background-color: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color); transition: 0.3s; display: flex; flex-direction: column; gap: 15px;
        }
        .emp-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(30, 64, 175, 0.1); border-color: rgba(30, 64, 175, 0.3); }

        .emp-header { display: flex; align-items: center; gap: 15px; }
        .emp-avatar {
            width: 55px; height: 55px; border-radius: 50%; background: var(--primary-gradient);
            display: flex; justify-content: center; align-items: center; color: white; font-weight: 700; font-size: 20px;
            box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
        }
        .emp-details h3 { margin: 0 0 5px 0; color: var(--text-main); font-size: 18px; font-weight: 700; }
        .emp-details p { margin: 0; color: var(--text-muted); font-size: 13px; font-weight: 500; }

        .rating-badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
        .rating-excellent { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .rating-good { background: rgba(59, 130, 246, 0.15); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.3); }
        .rating-average { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .rating-poor { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .rating-none { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); border: 1px solid rgba(100, 116, 139, 0.3); }

        .btn-rate { 
            background: transparent; color: var(--primary-color); border: 2px solid var(--primary-color); 
            padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s;
            width: 100%; margin-top: auto; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-rate:hover:not(:disabled) { background: var(--primary-gradient); color: white; border-color: transparent; box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2); }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--border-color); color: var(--text-muted); }

        .empty-msg { grid-column: 1 / -1; color: var(--text-muted); font-style: italic; text-align: center; padding: 40px; background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--border-color); font-size: 16px; backdrop-filter: blur(10px); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 550px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 90vh; }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); font-size: 22px; font-weight: 700; text-align: center;}
        
        /* قائمة مهام التقييم مع سكرول */
        .task-rating-list { overflow-y: auto; text-align: left; padding-right: 5px; flex: 1; }
        .task-rating-list::-webkit-scrollbar { width: 6px; }
        .task-rating-list::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; }
        
        .task-rating-item { background: rgba(0,0,0,0.03); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        [data-theme="dark"] .task-rating-item { background: rgba(255,255,255,0.03); }
        
        .task-rating-item h4 { margin: 0 0 10px 0; color: var(--text-main); font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .task-rating-item p { margin: 0 0 15px 0; font-size: 13px; color: var(--text-muted); line-height: 1.6; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px dashed var(--border-color); }
        
        .rating-label { display: block; font-weight: 600; font-size: 13px; color: var(--text-main); margin-bottom: 6px; margin-top: 15px; }
        
        .task-rating-select, .task-rating-textarea, .task-rating-file { width: 100%; padding: 10px 12px; border: 2px solid var(--border-color); border-radius: 8px; font-family: inherit; background-color: var(--input-bg); color: var(--text-main); transition: 0.3s; font-size: 14px; box-sizing: border-box; }
        .task-rating-select:focus, .task-rating-textarea:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }
        
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .submit-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 14px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
        .cancel-btn { background-color: #64748b; color: white; border: none; padding: 14px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .cancel-btn:hover { background-color: #475569; transform: translateY(-2px); }

        #customToast { position: fixed; top: 30px; right: 30px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        #customToast.show { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="premium-glow"></div>
    <div class="grid-overlay"></div>

    <nav>
        <div class="brand-logo" onclick="window.location.href='dashboard.html'">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" fill="var(--primary-color)" fill-opacity="0.15"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span>TaskHub System</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Back</button>
        </div>
    </nav>

    <div class="container">
        <h2>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Employee Management
        </h2>
        
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search by name, ID, or email..." oninput="loadEmployees()">
        </div>

        <div id="empList" class="emp-grid"></div>
    </div>

    <!-- Rating Modal (Tasks Based) with Feedback & PDF -->
    <div id="rateModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="rateModalTitle">Rate Completed Tasks</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px; text-align: center;">Evaluate the pending completed tasks for <span id="rateEmpName" style="font-weight: 700; color: var(--text-main);"></span>.</p>
            
            <div id="unratedTasksList" class="task-rating-list">
                <!-- Unrated tasks will appear here -->
            </div>
            
            <div class="modal-actions">
                <button class="submit-btn" onclick="saveTaskRatings()">Submit Ratings</button>
                <button class="cancel-btn" onclick="closeRateModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="customToast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="toastMsg">Action successful!</span>
    </div>

    <script>
        let activeUser = JSON.parse(sessionStorage.getItem("activeUser"));
        if (!activeUser || (activeUser.role !== "manager" && activeUser.empId !== "2300" && activeUser.empId !== "admin")) {
            window.location.href = "index.html"; 
        }

        const themeToggleBtn = document.getElementById("themeToggle");
        if (localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeToggleBtn.innerText = "☀️"; }
        function toggleTheme() {
            if (document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeToggleBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeToggleBtn.innerText = "☀️";
            }
        }

        function showToast(message) {
            document.getElementById("toastMsg").innerText = message;
            let toast = document.getElementById("customToast"); 
            toast.className = "show";
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function getRank(user) {
            if (user.empId === "2300") return 3; 
            if (user.role === "manager" || user.empId === "admin") return 2; 
            return 1; 
        }
        let myRank = getRank(activeUser);

        function loadEmployees() {
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            
            let container = document.getElementById("empList");
            let searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
            container.innerHTML = "";

            let subordinates = users.filter(u => {
                if (u.empId === activeUser.empId) return false; 
                return myRank > getRank(u); 
            });

            if (searchQuery) {
                subordinates = subordinates.filter(u => 
                    u.firstName.toLowerCase().includes(searchQuery) || 
                    u.lastName.toLowerCase().includes(searchQuery) ||
                    u.empId.toLowerCase().includes(searchQuery) ||
                    u.email.toLowerCase().includes(searchQuery)
                );
            }

            if (subordinates.length === 0) {
                container.innerHTML = "<div class='empty-msg'>No employees found matching your search.</div>";
                return;
            }

            subordinates.forEach(emp => {
                let ratingVal = parseFloat(emp.rating) || 0;
                let ratingClass = "rating-none";
                let ratingDisplay = "No Rating Yet";
                
                if (ratingVal >= 4.5) { ratingClass = "rating-excellent"; ratingDisplay = `⭐ ${ratingVal.toFixed(1)} / 5.0`; }
                else if (ratingVal >= 3.5) { ratingClass = "rating-good"; ratingDisplay = `⭐ ${ratingVal.toFixed(1)} / 5.0`; }
                else if (ratingVal >= 2.5) { ratingClass = "rating-average"; ratingDisplay = `⭐ ${ratingVal.toFixed(1)} / 5.0`; }
                else if (ratingVal > 0) { ratingClass = "rating-poor"; ratingDisplay = `⭐ ${ratingVal.toFixed(1)} / 5.0`; }

                let initials = (emp.firstName.charAt(0) + emp.lastName.charAt(0)).toUpperCase();

                let unratedTasks = allTasks.filter(t => t.employeeId === emp.empId && t.status === "Completed" && !t.ratingReceived);
                let pendingRatingsCount = unratedTasks.length;

                let buttonHtml = '';
                if (pendingRatingsCount > 0) {
                    buttonHtml = `
                        <button class="btn-rate" onclick="openTasksRateModal('${emp.empId}', '${emp.firstName} ${emp.lastName}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            Rate Tasks (${pendingRatingsCount} Pending)
                        </button>
                    `;
                } else {
                    buttonHtml = `
                        <button class="btn-rate btn-disabled" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            Up to date
                        </button>
                    `;
                }

                container.innerHTML += `
                    <div class="emp-card">
                        <div class="emp-header">
                            <div class="emp-avatar">${initials}</div>
                            <div class="emp-details">
                                <h3>${emp.firstName} ${emp.lastName}</h3>
                                <p>ID: ${emp.empId} • ${emp.role === 'manager' ? 'Manager' : 'Employee'}</p>
                            </div>
                        </div>
                        <div style="margin-bottom: 10px;">
                            <p style="margin: 0 0 8px 0; font-size: 13px; color: var(--text-muted);">Email: ${emp.email}</p>
                            <span class="rating-badge ${ratingClass}">Overall: ${ratingDisplay}</span>
                        </div>
                        ${buttonHtml}
                    </div>
                `;
            });
        }

        let empToRateId = null;

        function openTasksRateModal(empId, empName) {
            empToRateId = empId;
            document.getElementById("rateEmpName").innerText = empName;
            
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let unratedTasks = allTasks.filter(t => t.employeeId === empId && t.status === "Completed" && !t.ratingReceived);
            
            let taskListContainer = document.getElementById("unratedTasksList");
            taskListContainer.innerHTML = "";

            unratedTasks.forEach(task => {
                let empFileHtml = task.empPdfData ? `<a href="${task.empPdfData}" download="${task.empPdfName}" target="_blank" style="color: var(--primary-color); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px;">📎 View Emp Document (${task.empPdfName})</a>` : '';

                taskListContainer.innerHTML += `
                    <div class="task-rating-item">
                        <h4>📋 Task: ${task.description}</h4>
                        <p>⏱️ Duration: ${task.duration} <br>💬 Emp Note: ${task.employeeNote || 'None'} <br>${empFileHtml}</p>
                        
                        <label class="rating-label">Score (1-5 Stars):</label>
                        <select id="rating_score_${task.taskId}" class="task-rating-select">
                            <option value="5.0">⭐⭐⭐⭐⭐ (5.0) - Outstanding</option>
                            <option value="4.0">⭐⭐⭐⭐ (4.0) - Exceeds Expectations</option>
                            <option value="3.0" selected>⭐⭐⭐ (3.0) - Meets Expectations</option>
                            <option value="2.0">⭐⭐ (2.0) - Needs Improvement</option>
                            <option value="1.0">⭐ (1.0) - Unsatisfactory</option>
                        </select>

                        <label class="rating-label">Manager Feedback (Optional):</label>
                        <textarea id="rating_note_${task.taskId}" class="task-rating-textarea" rows="2" placeholder="Write feedback for the employee..."></textarea>

                        <label class="rating-label">Attach Evaluation PDF (Optional):</label>
                        <input type="file" id="rating_pdf_${task.taskId}" class="task-rating-file" accept=".pdf">
                    </div>
                `;
            });
            
            document.getElementById("rateModal").style.display = "flex";
        }
        
        function closeRateModal() {
            empToRateId = null;
            document.getElementById("rateModal").style.display = "none";
        }

        // دالة لقراءة الملف بشكل متزامن
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                let reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsDataURL(file);
            });
        }

        async function saveTaskRatings() {
            if (!empToRateId) return;
            
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let users = JSON.parse(localStorage.getItem("users")) || [];
            
            let unratedTasks = allTasks.filter(t => t.employeeId === empToRateId && t.status === "Completed" && !t.ratingReceived);
            
            // نستخدم Promise.all لأن عندنا رفع ملفات قد يأخذ وقت أجزاء من الثانية
            let updatePromises = unratedTasks.map(async (task) => {
                let scoreEl = document.getElementById("rating_score_" + task.taskId);
                let noteEl = document.getElementById("rating_note_" + task.taskId);
                let pdfEl = document.getElementById("rating_pdf_" + task.taskId);

                if (scoreEl) {
                    let ratingValue = parseFloat(scoreEl.value);
                    let managerFeedback = noteEl ? noteEl.value.trim() : "";
                    let managerPdfData = null;
                    let managerPdfName = null;

                    if (pdfEl && pdfEl.files.length > 0) {
                        let file = pdfEl.files[0];
                        managerPdfName = file.name;
                        managerPdfData = await readFileAsDataURL(file);
                    }

                    let tIndex = allTasks.findIndex(t => t.taskId === task.taskId);
                    if(tIndex !== -1) {
                        allTasks[tIndex].ratingReceived = ratingValue;
                        allTasks[tIndex].managerFeedback = managerFeedback;
                        allTasks[tIndex].managerPdfData = managerPdfData;
                        allTasks[tIndex].managerPdfName = managerPdfName;
                    }
                }
            });

            // ننتظر كل الملفات تترفع وتتحدث
            await Promise.all(updatePromises);

            // حساب المتوسط
            let empRatedTasks = allTasks.filter(t => t.employeeId === empToRateId && t.status === "Completed" && t.ratingReceived);
            let totalRating = 0;
            empRatedTasks.forEach(t => totalRating += t.ratingReceived);
            
            let newAverageRating = empRatedTasks.length > 0 ? (totalRating / empRatedTasks.length) : 0;

            let userIndex = users.findIndex(u => u.empId === empToRateId);
            if (userIndex !== -1) {
                users[userIndex].rating = newAverageRating;
            }

            localStorage.setItem("allTasks", JSON.stringify(allTasks));
            localStorage.setItem("users", JSON.stringify(users));
            
            showToast("Ratings, feedback, and files submitted successfully!");
            loadEmployees();
            closeRateModal();
        }

        loadEmployees();
        window.addEventListener('storage', function(e) {
            if (e.key === 'allTasks') loadEmployees();
        });
    </script>
</body>
</html>
