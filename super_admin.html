<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Console - TaskHub</title>
    <!-- خط Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Corporate Trust Theme with Super Admin Accents */
            --primary-color: #1e40af; 
            --primary-hover: #1e3a8a;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
            --super-admin-gradient: linear-gradient(135deg, #6d28d9 0%, #a855f7 100%);
            
            --bg-color: #f8fafc; 
            --card-bg: rgba(255, 255, 255, 0.85); 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(30, 64, 175, 0.15);
            
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
            --info: #0284c7;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6; 
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            --super-admin-gradient: linear-gradient(135deg, #8b5cf6 0%, #c084fc 100%);
            
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: var(--text-main); 
            transition: background-color 0.3s, color 0.3s; 
            position: relative;
            min-height: 100vh;
        }

        /* الهالة (بنفسجية وزرقاء للسوبر أدمن) */
        .premium-glow {
            position: fixed; top: -20%; right: -15%; width: 65%; height: 140%;
            background: linear-gradient(220deg, #0f172a 10%, #6d28d9 50%, #38bdf8 100%);
            filter: blur(150px); border-radius: 50%; z-index: 0; opacity: 0.7;
            animation: pulseGlow 10s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-20px, 30px); }
        }

        .grid-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(109, 40, 217, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(109, 40, 217, 0.06) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1; pointer-events: none;
        }

        /* النافبار الزجاجي */
        nav { 
            background-color: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 40px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        [data-theme="dark"] nav { background-color: rgba(15, 23, 42, 0.75); }

        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text-main); cursor: pointer; }
        .brand-logo span { background: var(--super-admin-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .theme-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.2s; }
        .theme-btn:hover { transform: scale(1.1) rotate(15deg); }
        .back-btn { background-color: #64748b; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background-color: #475569; transform: translateY(-2px); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 2; }
        
        .admin-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .admin-header h1 { margin: 0; font-size: 32px; font-weight: 800; background: var(--super-admin-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* إحصائيات النظام */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 25px; border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 20px;
        }
        .stat-icon { width: 60px; height: 60px; border-radius: 16px; background: rgba(109, 40, 217, 0.1); color: #8b5cf6; display: flex; justify-content: center; align-items: center; }
        [data-theme="dark"] .stat-icon { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .stat-info h3 { margin: 0; font-size: 28px; font-weight: 800; color: var(--text-main); }
        .stat-info p { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* جدول المستخدمين */
        .users-section {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 20px; padding: 30px; border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .users-section h2 { margin-top: 0; color: var(--text-main); font-size: 22px; font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }

        .search-wrapper { position: relative; margin-bottom: 25px; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-muted); }
        .search-input { width: 100%; padding: 15px 20px 15px 50px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; background: var(--input-bg); color: var(--text-main); font-family: inherit; transition: 0.3s; box-sizing: border-box; }
        .search-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }

        .user-list { display: flex; flex-direction: column; gap: 15px; }
        .user-row {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
            padding: 20px; border-radius: 16px; border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.02); transition: 0.3s;
        }
        [data-theme="dark"] .user-row { background: rgba(255,255,255,0.02); }
        .user-row:hover { transform: translateX(5px); background: var(--card-bg); box-shadow: 0 10px 25px rgba(109, 40, 217, 0.08); border-color: rgba(109, 40, 217, 0.3); }
        
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--super-admin-gradient); color: white; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 18px; box-shadow: 0 4px 10px rgba(109, 40, 217, 0.3); }
        .user-details h4 { margin: 0 0 5px 0; font-size: 16px; color: var(--text-main); font-weight: 700; }
        .user-details p { margin: 0; font-size: 13px; color: var(--text-muted); font-weight: 500; }
        
        .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .role-manager { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .role-employee { background: rgba(59, 130, 246, 0.15); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.3); }
        .role-super { background: var(--super-admin-gradient); color: white; box-shadow: 0 2px 10px rgba(109, 40, 217, 0.3); }

        .user-actions { display: flex; gap: 10px; }
        .btn-sm { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-promote { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-promote:hover { background: var(--success); color: white; }
        .btn-demote { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-demote:hover { background: var(--warning); color: white; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-delete:hover { background: var(--danger); color: white; }

        .empty-msg { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; border: 1px dashed var(--border-color); border-radius: 12px; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 35px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid var(--border-color); text-align: center; }
        .modal-content h3 { margin-top: 0; font-size: 22px; font-weight: 700; }
        
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; }
        .btn-confirm { border: none; padding: 12px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; color: white; transition: 0.2s; }
        .btn-confirm:hover { transform: translateY(-2px); }
        .btn-cancel { background-color: #64748b; color: white; border: none; padding: 12px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-cancel:hover { background-color: #475569; transform: translateY(-2px); }

        #customToast { position: fixed; top: 30px; right: 30px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: flex; align-items: center; gap: 10px; background: var(--super-admin-gradient); }
        #customToast.show { transform: translateX(0); }
    </style>
</head>
<body>

    <!-- الهالة والشبكة -->
    <div class="premium-glow"></div>
    <div class="grid-overlay"></div>

    <nav>
        <div class="brand-logo" onclick="window.location.href='dashboard.html'">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #8b5cf6;">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>Super Admin</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
        </div>
    </nav>

    <div class="container">
        
        <div class="admin-header">
            <h1>👑 System Control Center</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div class="stat-info">
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--success); background: rgba(16, 185, 129, 0.1);">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                </div>
                <div class="stat-info">
                    <h3 id="totalManagers">0</h3>
                    <p>System Managers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--info); background: rgba(59, 130, 246, 0.1);">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <div class="stat-info">
                    <h3 id="totalTasks">0</h3>
                    <p>Total Tasks</p>
                </div>
            </div>
        </div>

        <div class="users-section">
            <h2>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #8b5cf6;"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Manage System Accounts
            </h2>
            
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name, ID, email, or role..." oninput="loadUsers()">
            </div>

            <div id="usersList" class="user-list">
                <!-- Users will load here -->
            </div>
        </div>
    </div>

    <!-- Action Modal -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalDesc" style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;"></p>
            <div class="modal-actions">
                <button id="confirmBtn" class="btn-confirm" onclick="executeAction()">Yes, Proceed</button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="customToast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="toastMsg">Action successful!</span>
    </div>

    <script>
        // Security Check - STRICTLY FOR 2300 (or 'admin' if you set it up that way)
        let activeUser = JSON.parse(sessionStorage.getItem("activeUser"));
        if (!activeUser || activeUser.empId !== "2300") {
            window.location.href = "index.html"; 
        }

        const themeToggleBtn = document.getElementById("themeToggle");
        if (localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeToggleBtn.innerText = "☀️"; }
        function toggleTheme() {
            if (document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeToggleBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeToggleBtn.innerText = "☀️";
            }
        }

        function showToast(message) {
            document.getElementById("toastMsg").innerText = message;
            let toast = document.getElementById("customToast"); 
            toast.className = "show";
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function loadStats(users) {
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let managersCount = users.filter(u => u.role === "manager").length;
            
            document.getElementById("totalUsers").innerText = users.length;
            document.getElementById("totalManagers").innerText = managersCount;
            document.getElementById("totalTasks").innerText = allTasks.length;
        }

        function loadUsers() {
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let container = document.getElementById("usersList");
            let searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
            container.innerHTML = "";

            loadStats(users);

            let filteredUsers = users;
            if (searchQuery) {
                filteredUsers = users.filter(u => 
                    u.firstName.toLowerCase().includes(searchQuery) || 
                    u.lastName.toLowerCase().includes(searchQuery) ||
                    u.empId.toLowerCase().includes(searchQuery) ||
                    u.email.toLowerCase().includes(searchQuery) ||
                    u.role.toLowerCase().includes(searchQuery)
                );
            }

            if (filteredUsers.length === 0) {
                container.innerHTML = "<div class='empty-msg'>No users found matching your search.</div>";
                return;
            }

            filteredUsers.forEach(user => {
                let initials = (user.firstName.charAt(0) + user.lastName.charAt(0)).toUpperCase();
                let isMe = user.empId === "2300";
                
                let roleClass = user.role === 'manager' ? 'role-manager' : 'role-employee';
                let roleText = user.role === 'manager' ? 'Manager' : 'Employee';
                if (isMe) { roleClass = 'role-super'; roleText = 'Super Admin'; }

                let buttonsHtml = '';
                if (!isMe) {
                    if (user.role === 'employee') {
                        buttonsHtml += `<button class="btn-sm btn-promote" onclick="openModal('${user.empId}', 'promote')">⬆️ Promote</button>`;
                    } else if (user.role === 'manager') {
                        buttonsHtml += `<button class="btn-sm btn-demote" onclick="openModal('${user.empId}', 'demote')">⬇️ Demote</button>`;
                    }
                    buttonsHtml += `<button class="btn-sm btn-delete" onclick="openModal('${user.empId}', 'delete')">🗑️ Delete</button>`;
                } else {
                    buttonsHtml = `<span style="font-size: 13px; font-weight: 600; color: var(--text-muted); font-style: italic;">Cannot modify own account</span>`;
                }

                container.innerHTML += `
                    <div class="user-row">
                        <div class="user-info">
                            <div class="user-avatar">${initials}</div>
                            <div class="user-details">
                                <h4>${user.firstName} ${user.lastName} <span class="role-badge ${roleClass}">${roleText}</span></h4>
                                <p>ID: ${user.empId} • ${user.email}</p>
                            </div>
                        </div>
                        <div class="user-actions">
                            ${buttonsHtml}
                        </div>
                    </div>
                `;
            });
        }

        let targetUserId = null;
        let targetAction = null;

        function openModal(empId, action) {
            targetUserId = empId;
            targetAction = action;
            
            let modalTitle = document.getElementById("modalTitle");
            let modalDesc = document.getElementById("modalDesc");
            let confirmBtn = document.getElementById("confirmBtn");

            if (action === "promote") {
                modalTitle.innerText = "Promote to Manager";
                modalTitle.style.color = "var(--success)";
                modalDesc.innerText = "This user will gain manager privileges (assigning tasks, approving leaves). Proceed?";
                confirmBtn.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
                confirmBtn.style.boxShadow = "0 4px 10px rgba(16, 185, 129, 0.2)";
                confirmBtn.innerText = "Yes, Promote";
            } else if (action === "demote") {
                modalTitle.innerText = "Demote to Employee";
                modalTitle.style.color = "var(--warning)";
                modalDesc.innerText = "This user will lose manager privileges. Proceed?";
                confirmBtn.style.background = "linear-gradient(135deg, #f59e0b 0%, #b45309 100%)";
                confirmBtn.style.boxShadow = "0 4px 10px rgba(245, 158, 11, 0.2)";
                confirmBtn.innerText = "Yes, Demote";
            } else if (action === "delete") {
                modalTitle.innerText = "Delete User Account";
                modalTitle.style.color = "var(--danger)";
                modalDesc.innerText = "WARNING: This action is permanent and cannot be undone. Proceed?";
                confirmBtn.style.background = "linear-gradient(135deg, #ef4444 0%, #b91c1c 100%)";
                confirmBtn.style.boxShadow = "0 4px 10px rgba(239, 68, 68, 0.2)";
                confirmBtn.innerText = "Yes, Delete";
            }

            document.getElementById("actionModal").style.display = "flex";
        }

        function closeModal() {
            targetUserId = null;
            targetAction = null;
            document.getElementById("actionModal").style.display = "none";
        }

        function executeAction() {
            if (!targetUserId || !targetAction) return;

            let users = JSON.parse(localStorage.getItem("users")) || [];
            let index = users.findIndex(u => u.empId === targetUserId);

            if (index !== -1) {
                if (targetAction === "promote") {
                    users[index].role = "manager";
                    showToast("User promoted to Manager!");
                } else if (targetAction === "demote") {
                    users[index].role = "employee";
                    showToast("User demoted to Employee.");
                } else if (targetAction === "delete") {
                    users.splice(index, 1);
                    showToast("User account deleted permanently.");
                }
                
                localStorage.setItem("users", JSON.stringify(users));
                loadUsers();
            }
            closeModal();
        }

        loadUsers();
    </script>
</body>
</html>
