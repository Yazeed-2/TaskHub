<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign & Manage Tasks - TaskHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Corporate Trust Theme */
            --primary-color: #1e40af; 
            --primary-hover: #1e3a8a;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #0ea5e9 100%);
            --bg-color: #f8fafc; 
            --card-bg: rgba(255, 255, 255, 0.85); 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(30, 64, 175, 0.15);
            
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
            --info: #0284c7;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6; 
            --primary-hover: #60a5fa;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(15, 23, 42, 0.9);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: var(--text-main); 
            transition: background-color 0.3s, color 0.3s; 
            position: relative;
            min-height: 100vh;
        }

        /* الهالة والشبكة */
        .premium-glow {
            position: fixed; top: -20%; right: -15%; width: 65%; height: 140%;
            background: linear-gradient(220deg, #0f172a 10%, #1e40af 50%, #38bdf8 100%);
            filter: blur(140px); border-radius: 50%; z-index: 0; opacity: 0.8;
            animation: pulseGlow 10s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-20px, 30px); }
        }

        .grid-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(30, 64, 175, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 64, 175, 0.06) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1; pointer-events: none;
        }

        nav { 
            background-color: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 40px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }
        [data-theme="dark"] nav { background-color: rgba(15, 23, 42, 0.75); }

        .brand-logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text-main); cursor: pointer; }
        .brand-logo span { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .theme-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; transition: 0.2s; }
        .theme-btn:hover { transform: scale(1.1) rotate(15deg); }
        .back-btn { background-color: #64748b; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .back-btn:hover { background-color: #475569; transform: translateY(-2px); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 2; }
        
        h2 { color: var(--primary-color); margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

        /* شريط التحكم (بحث وفرز) */
        .controls-bar { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-wrapper { flex: 2; position: relative; min-width: 250px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; height: 18px; }
        
        .search-input, .sort-select { 
            width: 100%; padding: 14px 15px; border: 2px solid var(--border-color); 
            border-radius: 12px; font-size: 14px; outline: none; background-color: var(--card-bg); 
            color: var(--text-main); font-family: inherit; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .search-input { padding-left: 45px; }
        .sort-select { flex: 1; min-width: 200px; cursor: pointer; font-weight: 600; }
        .search-input:focus, .sort-select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }

        /* --- تصميم البطاقات المربعة (الشبكة) نفس صفحة الموظفين --- */
        .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-bottom: 50px; }

        .emp-card {
            background-color: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color); transition: 0.3s; display: flex; flex-direction: column; gap: 15px;
        }
        .emp-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(30, 64, 175, 0.1); border-color: rgba(30, 64, 175, 0.3); }

        .emp-header { display: flex; align-items: center; gap: 15px; }
        .emp-avatar {
            width: 50px; height: 50px; border-radius: 50%; background: var(--primary-gradient);
            display: flex; justify-content: center; align-items: center; color: white; font-weight: 700; font-size: 18px;
            box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3); flex-shrink: 0;
        }
        .emp-details h3 { margin: 0 0 5px 0; color: var(--text-main); font-size: 17px; font-weight: 700; display: flex; flex-direction: column; gap: 4px;}
        .emp-details p { margin: 0; color: var(--text-muted); font-size: 13px; font-weight: 500; }

        .role-tag { align-self: flex-start; font-size: 10px; padding: 3px 8px; border-radius: 12px; background: rgba(30, 64, 175, 0.1); color: var(--primary-color); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        [data-theme="dark"] .role-tag { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

        .emp-stats { display: flex; flex-direction: column; gap: 8px; }
        .stat-pill { 
            background-color: rgba(0,0,0,0.03); padding: 8px 12px; border-radius: 8px; 
            font-size: 13px; font-weight: 600; color: var(--text-muted); border: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 6px;
        }
        [data-theme="dark"] .stat-pill { background-color: rgba(255,255,255,0.03); }
        
        .priority-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; color: white; display: inline-block; width: fit-content; }
        .priority-High { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .priority-Medium { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
        .priority-Low { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }

        /* أزرار على عرض البطاقة (Full Width) */
        .btn-full { 
            width: 100%; margin-top: auto; display: flex; justify-content: center; align-items: center; gap: 8px;
            padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; border: none; color: white;
        }
        .btn-primary { background: var(--primary-gradient); box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(30, 64, 175, 0.3); }
        
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(239, 68, 68, 0.3); }

        .empty-msg { grid-column: 1 / -1; color: var(--text-muted); font-style: italic; text-align: center; padding: 40px; background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--border-color); font-size: 15px; backdrop-filter: blur(10px); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 35px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); border: 1px solid var(--border-color); }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); font-size: 22px; font-weight: 700; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: var(--text-main); }
        textarea, select, input[type="file"] { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-family: inherit; background-color: var(--input-bg); color: var(--text-main); transition: 0.3s; }
        textarea:focus, select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1); }
        
        .modal-actions { display: flex; gap: 15px; margin-top: 25px; }
        .submit-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 12px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
        .cancel-btn { background-color: #64748b; color: white; border: none; padding: 12px; flex: 1; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .cancel-btn:hover { background-color: #475569; transform: translateY(-2px); }

        #customToast { position: fixed; top: 30px; right: 30px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 9999; transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: flex; align-items: center; gap: 10px; }
        #customToast.show { transform: translateX(0); }
        .toast-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .toast-error { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .toast-info { background: var(--primary-gradient); }
    </style>
</head>
<body>

    <div class="premium-glow"></div>
    <div class="grid-overlay"></div>

    <nav>
        <div class="brand-logo" onclick="window.location.href='dashboard.html'">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" fill="var(--primary-color)" fill-opacity="0.15"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span>TaskHub System</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Back</button>
        </div>
    </nav>

    <div class="container">
        <h2>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Select Subordinate to Assign Task
        </h2>
        
        <div class="controls-bar">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search employee by name..." oninput="loadEmployees()">
            </div>
            <select id="sortSelect" class="sort-select" onchange="loadEmployees()">
                <option value="tasks_asc">Sort by: Least Active Tasks</option>
                <option value="tasks_desc">Sort by: Most Active Tasks</option>
                <option value="rating_desc">Sort by: Highest Rating</option>
            </select>
        </div>
        
        <!-- الحاوية صارت Grid نفس الموظفين -->
        <div id="employeeListContainer" class="emp-grid"></div>

        <h2 style="margin-top: 50px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Manage Active Tasks (History)
        </h2>
        
        <!-- الحاوية صارت Grid للمهام النشطة -->
        <div id="activeTasksContainer" class="emp-grid"></div>
    </div>

    <!-- Task Assignment Modal -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">Assign Task</h3>
            <div class="form-group">
                <label>Task Priority</label>
                <select id="taskPriority">
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
            </div>
            <div class="form-group">
                <label>Task Description</label>
                <textarea id="taskDesc" rows="4" placeholder="Describe the task details clearly..."></textarea>
            </div>
            <div class="form-group">
                <label>Attach PDF (Optional)</label>
                <input type="file" id="taskPdfFile" accept=".pdf" style="padding: 8px;">
            </div>
            <div class="modal-actions">
                <button class="submit-btn" onclick="prepareAndSubmitTask()">Send Task</button>
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Task Modal -->
    <div id="deleteTaskModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--danger);">Cancel Assigned Task?</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Are you sure you want to remove this active task from the employee?</p>
            <div class="modal-actions">
                <button class="submit-btn" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);" onclick="executeDeleteTask()">Yes, Remove</button>
                <button class="cancel-btn" onclick="closeDeleteTaskModal()">No, Keep it</button>
            </div>
        </div>
    </div>

    <div id="customToast">
        <svg id="toastIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        let activeUser = JSON.parse(sessionStorage.getItem("activeUser"));
        if (!activeUser || (activeUser.role !== "manager" && activeUser.empId !== "2300" && activeUser.empId !== "admin")) {
            window.location.href = "index.html"; 
        }

        const themeToggleBtn = document.getElementById("themeToggle");
        if (localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeToggleBtn.innerText = "☀️"; }
        function toggleTheme() {
            if (document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeToggleBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeToggleBtn.innerText = "☀️";
            }
        }

        function showToast(message, type = "success") {
            let toast = document.getElementById("customToast"); 
            let msgSpan = document.getElementById("toastMsg");
            let iconSvg = document.getElementById("toastIcon");
            
            msgSpan.innerText = message; 
            toast.className = "toast-" + type + " show";
            
            if (type === 'success') {
                iconSvg.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
            } else if (type === 'error') {
                iconSvg.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>';
            } else {
                iconSvg.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>';
            }

            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function getRank(user) {
            if (user.empId === "2300") return 3; 
            if (user.role === "manager" || user.empId === "admin") return 2; 
            return 1; 
        }

        let myRank = getRank(activeUser);

        function loadEmployees() {
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let container = document.getElementById("employeeListContainer");
            let searchQuery = document.getElementById("searchInput").value.toLowerCase();
            let sortOption = document.getElementById("sortSelect").value;
            container.innerHTML = ""; 

            let validTargets = users.filter(u => {
                if (u.empId === activeUser.empId) return false; 
                return myRank > getRank(u); 
            });

            let employees = validTargets.map(emp => {
                let activeTasksCount = allTasks.filter(t => t.employeeId === emp.empId && t.status !== "Completed").length;
                let ratingVal = parseFloat(emp.rating) || 0; 
                return { ...emp, activeTasksCount, ratingVal };
            });

            if (searchQuery) {
                employees = employees.filter(emp => emp.firstName.toLowerCase().includes(searchQuery) || emp.lastName.toLowerCase().includes(searchQuery));
            }

            employees.sort((a, b) => {
                if (sortOption === "tasks_asc") return a.activeTasksCount - b.activeTasksCount;
                if (sortOption === "tasks_desc") return b.activeTasksCount - a.activeTasksCount;
                if (sortOption === "rating_desc") return b.ratingVal - a.ratingVal;
                return 0;
            });

            if (employees.length === 0) {
                container.innerHTML = "<div class='empty-msg'>No subordinates found matching your criteria.</div>";
                return;
            }

            employees.forEach(emp => {
                let ratingDisplay = emp.ratingVal > 0 ? emp.ratingVal.toFixed(1) + " / 5.0" : "New";
                let roleDisplay = emp.role === 'manager' ? 'Manager' : 'Employee';
                let initials = (emp.firstName.charAt(0) + emp.lastName.charAt(0)).toUpperCase();

                // تم تغيير التصميم ليطابق شكل صفحة الموظفين (مربعات)
                container.innerHTML += `
                    <div class="emp-card">
                        <div class="emp-header">
                            <div class="emp-avatar">${initials}</div>
                            <div class="emp-details">
                                <h3>${emp.firstName} ${emp.lastName} <span class="role-tag">${roleDisplay}</span></h3>
                                <p>ID: ${emp.empId}</p>
                            </div>
                        </div>
                        <div class="emp-stats">
                            <span class="stat-pill">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                Rating: ${ratingDisplay}
                            </span>
                            <span class="stat-pill">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                Active Tasks: ${emp.activeTasksCount}
                            </span>
                        </div>
                        <button class="btn-full btn-primary" onclick="openModal('${emp.empId}', '${emp.firstName} ${emp.lastName}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Assign Task
                        </button>
                    </div>
                `;
            });
        }

        function loadActiveTasks() {
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let container = document.getElementById("activeTasksContainer");
            container.innerHTML = "";

            let myAssignedTasks = allTasks.filter(t => t.status !== "Completed" && (t.managerId === activeUser.empId || activeUser.empId === "2300"));

            if (myAssignedTasks.length === 0) {
                container.innerHTML = "<div class='empty-msg'>You haven't assigned any active tasks.</div>";
                return;
            }

            myAssignedTasks.forEach(task => {
                let targetUser = users.find(u => u.empId === task.employeeId);
                let targetName = targetUser ? `${targetUser.firstName} ${targetUser.lastName}` : "Unknown User";
                let fileHtml = task.pdfData ? `<a href="${task.pdfData}" download="${task.pdfName}" target="_blank" style="color: var(--primary-color); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-size: 13px;">📎 Attached PDF: ${task.pdfName}</a>` : '';

                // تم تغيير التصميم ليطابق شكل صفحة الموظفين (مربعات) للمهام النشطة أيضاً
                container.innerHTML += `
                    <div class="emp-card">
                        <div class="emp-header">
                            <div class="emp-details">
                                <h3 style="font-size: 16px; line-height: 1.4;">${task.description}</h3>
                            </div>
                        </div>
                        <div class="emp-stats">
                            <span class="priority-badge priority-${task.priority}">Priority: ${task.priority}</span>
                            <span class="stat-pill">👤 To: ${targetName}</span>
                            <span class="stat-pill">📅 Date: ${task.assignedDate}</span>
                            ${fileHtml}
                        </div>
                        <button class="btn-full btn-danger" onclick="openDeleteTaskModal('${task.taskId}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Cancel Task
                        </button>
                    </div>
                `;
            });
        }

        let selectedEmployeeId = null;
        function openModal(empId, empName) {
            selectedEmployeeId = empId;
            document.getElementById("modalTitle").innerText = "Assign Task to " + empName;
            document.getElementById("taskDesc").value = "";
            document.getElementById("taskPdfFile").value = "";
            document.getElementById("taskPriority").value = "Medium";
            document.getElementById("taskModal").style.display = "flex";
        }
        function closeModal() {
            selectedEmployeeId = null;
            document.getElementById("taskModal").style.display = "none";
        }

        function prepareAndSubmitTask() {
            let desc = document.getElementById("taskDesc").value.trim();
            let priority = document.getElementById("taskPriority").value;
            let fileInput = document.getElementById("taskPdfFile");

            if (!desc) { showToast("Please enter a task description.", "error"); return; }

            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.onload = function(e) {
                    saveTaskToStorage(desc, priority, e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                saveTaskToStorage(desc, priority, null, null);
            }
        }

        function saveTaskToStorage(desc, priority, pdfData, pdfName) {
            let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
            let newTask = {
                taskId: Date.now().toString(), 
                employeeId: selectedEmployeeId, 
                managerId: activeUser.empId,
                description: desc, 
                priority: priority, 
                status: "Pending", 
                assignedDate: new Date().toLocaleDateString('en-US'),
                pdfData: pdfData,
                pdfName: pdfName
            };
            allTasks.push(newTask); 
            localStorage.setItem("allTasks", JSON.stringify(allTasks));
            showToast("Task successfully assigned!", "success");
            closeModal(); 
            loadEmployees(); 
            loadActiveTasks();
        }

        let taskToDeleteId = null;
        function openDeleteTaskModal(taskId) { taskToDeleteId = taskId; document.getElementById("deleteTaskModal").style.display = "flex"; }
        function closeDeleteTaskModal() { taskToDeleteId = null; document.getElementById("deleteTaskModal").style.display = "none"; }
        function executeDeleteTask() {
            if (taskToDeleteId) {
                let allTasks = JSON.parse(localStorage.getItem("allTasks")) || [];
                allTasks = allTasks.filter(t => t.taskId !== taskToDeleteId);
                localStorage.setItem("allTasks", JSON.stringify(allTasks));
                showToast("Task cancelled.", "info");
                loadEmployees(); loadActiveTasks();
            }
            closeDeleteTaskModal();
        }

        loadEmployees();
        loadActiveTasks();
        
        window.addEventListener('storage', function(e) {
            if (e.key === 'allTasks') {
                loadEmployees();
                loadActiveTasks();
            }
        });
    </script>
</body>
</html>
